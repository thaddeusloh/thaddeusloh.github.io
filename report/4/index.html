<style>
:root{--forest:#1B4332;--ink:#0C1F19;--gold:#C9A227;--gold-pale:#F0E3B8;--sage:#A8C5B4;--sage-pale:#DCE9E1;--danger:#E8A9A0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--forest);color:var(--sage-pale);font-family:"Space Grotesk",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:radial-gradient(circle at 20% 15%,rgba(45,106,79,.55),transparent 55%),radial-gradient(circle at 85% 85%,rgba(12,31,25,.7),transparent 60%)}
.box{width:100%;max-width:380px;text-align:left}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:29px;line-height:1.2;color:#fff;margin:10px 0 6px}
h1 em{font-style:normal;font-weight:600;color:var(--gold-pale)}
p.sub{margin:0 0 22px;font-size:14px;color:#A9C4B6;line-height:1.5}
label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8FAE9E;margin-bottom:7px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-family:inherit;font-size:15px;color:#fff;background:rgba(255,255,255,.07);
  border:1px solid rgba(168,197,180,.32);border-radius:9px;padding:12px 14px;letter-spacing:.08em}
input::placeholder{color:#6E8C7C;letter-spacing:0}
input:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.11)}
button{font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--gold-pale);
  border:none;border-radius:9px;padding:12px 20px;cursor:pointer}
button:hover{background:#fff}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:13px;font-size:13px;min-height:19px;color:var(--danger)}
.msg.work{color:var(--sage)}
.rule{height:1px;background:rgba(168,197,180,.2);margin:24px 0 14px}
.foot{font-size:11px;color:#6E8C7C;line-height:1.5}
</style>
</head>

<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById('msg');
const pw = document.getElementById('pw');
const go = document.getElementById('go');

async function unlock(){
  const pass = pw.value;
  if(!pass){ msg.className='msg'; msg.textContent='Enter the password to continue.'; pw.focus(); return; }
  go.disabled = true; msg.className='msg work'; msg.textContent='Unlocking\u2026';
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:dec(P.s), iterations:P.n, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:dec(P.i)}, key, dec(P.c));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(e){
    go.disabled = false;
    msg.className='msg';
    msg.textContent='That password is incorrect. Try again.';
    pw.value=''; pw.focus();
  }
}
go.addEventListener('click', unlock);
pw.addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
</script>
